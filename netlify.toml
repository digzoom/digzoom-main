[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Browser security headers for every static page and asset.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Vite fingerprints these filenames, so a browser can safely reuse them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images retain their names when the site is updated; keep their TTL short.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Contact form submission — MUST be before /api/*
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/client-error"
  to = "/.netlify/functions/client-error"
  status = 200

[[redirects]]
  from = "/api/growth-audit"
  to = "/.netlify/functions/growth-audit"
  status = 200

[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

[[redirects]]
  from = "/api/service-checkout"
  to = "/.netlify/functions/service-checkout"
  status = 200

[[redirects]]
  from = "/api/partner-application"
  to = "/.netlify/functions/partner-application"
  status = 200

# Stripe requires the exact raw request body for signature verification.
[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# tRPC batch endpoint — exact match for /api (no trailing slash)
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

# tRPC sub-paths (if any)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Contact form submission — MUST be before /api/*
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/client-error"
  to = "/.netlify/functions/client-error"
  status = 200

[[redirects]]
  from = "/api/growth-audit"
  to = "/.netlify/functions/growth-audit"
  status = 200

[[redirects]]
  from = "/api/partner-application"
  to = "/.netlify/functions/partner-application"
  status = 200

# tRPC batch endpoint — exact match for /api (no trailing slash)
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

# tRPC sub-paths (if any)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
